<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Super Secured</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      overflow: hidden;
      animation: fadeIn 2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container {
      text-align: center;
      padding: 40px 30px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      animation: scaleUp 1.5s ease;
    }

    @keyframes scaleUp {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .shield-icon {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 25px;
      animation: pulse 2.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .shield-icon svg {
      width: 100%;
      height: 100%;
      fill: #00f0ff;
      filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.5));
    }

    .emoji-lock {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 40px;
      filter: drop-shadow(0 0 6px rgba(0, 255, 255, 0.7));
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      0% { opacity: 0.8; text-shadow: 0 0 5px cyan; }
      100% { opacity: 1; text-shadow: 0 0 15px cyan; }
    }

    .title {
      font-size: 28px;
      margin-bottom: 10px;
      animation: fadeIn 1.5s ease 0.5s both;
    }

    .subtitle {
      font-size: 15px;
      color: #c4f4ff;
      margin-bottom: 25px;
      animation: fadeIn 1.5s ease 0.8s both;
    }

    .btn {
      background: #00f0ff;
      color: #000;
      border: none;
      padding: 12px 25px;
      border-radius: 30px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s ease;
      animation: fadeIn 1.5s ease 1s both;
    }

    .btn:hover {
      background: #00c7d4;
      box-shadow: 0 0 10px cyan;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="shield-icon">
      <!-- Shield SVG -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 2L4 5v6c0 5.55 3.84 10.74 8 11 4.16-.26 8-5.45 8-11V5l-8-3z"/>
      </svg>
      <!-- Emoji Lock -->
      <div class="emoji-lock">🔐</div>
    </div>

    <div class="title">Your Account is Super Secured</div>
    <div class="subtitle">Shielded by top-level encryption and digital protection.</div>
    <button class="btn" onclick="window.location.href='index.html'">Go Back</button>
  </div>
</body>
</html>
